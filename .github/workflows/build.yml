name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Mostrar errores
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Could not|FAILURE" -A2 build.log | head -60 | while IFS= read -r l; do
            echo "::error::$l"
          done

      - name: Preparar APK
        run: cp app/build/outputs/apk/release/app-release.apk lallamada.apk

      - uses: actions/upload-artifact@v4
        with:
          name: lallamada-apk
          path: lallamada.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: La Llamada (última versión)
          body: "APK compilada automáticamente desde ${{ github.sha }}. Descargá lallamada.apk desde el celular e instalala."
          files: lallamada.apk
          make_latest: true
